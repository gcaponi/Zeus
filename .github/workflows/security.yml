name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: >-
          semgrep scan
          --config p/python
          --sarif
          --output semgrep.sarif
          --metrics=off
          apps config
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  bandit:
    name: Bandit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: >-
          bandit -q -r apps config
          -lll
          -x '**/migrations/*,**/tests/*'

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project -o zeus-reqs.txt
      - run: pip install pip-audit
      - run: pip-audit -r zeus-reqs.txt --progress-spinner off --output pip-audit.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pip-audit
          path: pip-audit.txt
          if-no-files-found: ignore
